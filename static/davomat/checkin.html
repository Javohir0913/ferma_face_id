<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Ish belgilash</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/static/davomat/app.css?v=15">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    main { max-width: 520px; padding-bottom: 32px; }
    .dir { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .dir .btn { min-height: 56px; font-size: 16px; }
    .dir .btn.sel { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
    .cam { position: relative; background: #000; border-radius: 22px; overflow: hidden; aspect-ratio: 3 / 4; }
    .cam::after { content: ""; position: absolute; left: 50%; top: 46%; width: 58%; aspect-ratio: 3 / 4; transform: translate(-50%, -50%);
      border: 3px dashed rgba(255, 255, 255, .55); border-radius: 50%; pointer-events: none; }
    .cam.taken::after { display: none; }
    .hello { display: flex; gap: 12px; align-items: center; }
    .hello .logo { width: 44px; height: 44px; font-size: 20px; border-radius: 14px; }
    .cam video, .cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cam video { transform: scaleX(-1); }
    .step { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .step:last-child { border-bottom: 0; }
    .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; flex: none;
           background: var(--bg); border: 1px solid var(--line); }
    .dot.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
    .dot.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
    .big { width: 100%; min-height: 52px; font-size: 16px; margin-top: 10px; }
  </style>
</head>
<body>
  <main id="app"><div class="empty"><span class="spin"></span></div></main>
  <script src="/static/davomat/checkin.js?v=15"></script>
</body>
</html>
