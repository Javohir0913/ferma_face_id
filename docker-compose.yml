# Ферма: PostgreSQL + web/API (приём Face ID, Mini App) + Telegram-бот.
# Запуск:  docker compose up -d --build
# Настройки в файле .env (образец: .env.example).
name: ferma

x-app: &app
  build: .
  image: ferma:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ferma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ferma}
  volumes:
    - checkins:/app/data/checkins
    - snapshots:/app/static/snapshots
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Время пишется по Ташкенту (приложение) или в UTC (created_at) — база не должна его сдвигать.
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ferma}
      POSTGRES_USER: ${POSTGRES_USER:-ferma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da bo'lishi shart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только с этого же компьютера (для бэкапа и переноса); наружу не открывается.
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    <<: *app
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    <<: *app
    command: ["python", "-m", "davomat.bot"]
    # Таблицы создаёт app — бот запускается после того, как он готов.
    depends_on:
      app: { condition: service_healthy }

volumes:
  pgdata:
  checkins:
  snapshots:
